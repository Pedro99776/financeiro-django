{% extends 'contas/base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 text-primary"><i class="bi bi-receipt"></i> Nova Transação</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}

                    {% if form.non_field_errors %}
                    <div class="alert alert-danger" role="alert">
                        {% for error in form.non_field_errors %}
                            {{ error }}
                        {% endfor %}
                    </div>
                    {% endif %}
                    

                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Data</label>
                        <input type="date" name="data" class="form-control" required value="{{ form.data.value|date:'Y-m-d'|default:'' }}">
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">Valor</label>
                            <!-- Note: form.valor.value might be Decimal, formatted appropriately -->
                            <input type="number" step="0.01" name="valor" class="form-control" placeholder="0,00" required value="{{ form.valor.value|stringformat:'s'|default:'' }}">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">Tipo</label>
                            <select name="tipo" class="form-select">
                                <option value="D" {% if form.tipo.value == 'D' %}selected{% endif %}>Despesa</option>
                                <option value="R" {% if form.tipo.value == 'R' %}selected{% endif %}>Receita</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descrição <span class="text-muted small">(Opcional)</span></label>
                        <input type="text" name="descricao" class="form-control" placeholder="Ex: Mercado, Uber..." value="{{ form.descricao.value|default:'' }}">
                    </div>

                    <!-- Toggle Forma de Pagamento -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Forma de Pagamento</label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="tipoPagamento" id="optConta" value="conta" {% if not form.cartao.value %}checked{% endif %}>
                            <label class="btn btn-outline-primary" for="optConta"><i class="bi bi-wallet2"></i> Conta / Débito</label>

                            <input type="radio" class="btn-check" name="tipoPagamento" id="optCartao" value="cartao" {% if form.cartao.value %}checked{% endif %}>
                            <label class="btn btn-outline-primary" for="optCartao"><i class="bi bi-credit-card"></i> Cartão de Crédito</label>
                        </div>
                    </div>

                    <!-- Seleção Dinâmica -->
                    <div class="row">
                        <div class="col-12 mb-3" id="divConta">
                            <label class="form-label fw-bold">Conta</label>
                            {{ form.conta }}
                        </div>
                        <div class="col-12 mb-3" id="divCartao" style="display: none;">
                            <label class="form-label fw-bold">Cartão</label>
                            {{ form.cartao }}
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Categoria</label>
                        {{ form.categoria }}
                    </div>

                    <script>
                        document.addEventListener('DOMContentLoaded', function() {
                            const optConta = document.getElementById('optConta');
                            const optCartao = document.getElementById('optCartao');
                            const divConta = document.getElementById('divConta');
                            const divCartao = document.getElementById('divCartao');
                            const selConta = document.querySelector('[name="conta"]');
                            const selCartao = document.querySelector('[name="cartao"]');

                            function toggleCampos() {
                                if (optCartao.checked) {
                                    divConta.style.display = 'none';
                                    divCartao.style.display = 'block';
                                    if (!selCartao.value && selConta.value) selConta.value = ''; // Se mudou para cartão, limpa conta? Cuidado ao editar.
                                } else {
                                    divConta.style.display = 'block';
                                    divCartao.style.display = 'none';
                                    if (!selConta.value && selCartao.value) selCartao.value = '';
                                }
                            }

                            // Inicializa
                            toggleCampos();

                            optConta.addEventListener('change', toggleCampos);
                            optCartao.addEventListener('change', toggleCampos);
                        });
                    </script>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Salvar Transação</button>
                        <a href="{% url 'listagem' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
